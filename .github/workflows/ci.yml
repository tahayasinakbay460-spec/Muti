# Her push ve pull request'te çalışan kalite kapısı: biri kırmızıysa kod main'e birleştirilmez.
# Hiçbir gizli anahtar gerekmez: testler kendi geçici SQLite veritabanını ve sahte SECRET_KEY'i
# kullanır (bkz. backend/tests/conftest.py), internete çıkan bir servis çağrılmaz.
name: CI

on:
  push:              # her dalda (branch) çalışır, böylece yarım işler de kontrol edilir
  pull_request:
    branches: [main]

permissions:
  contents: read

# Aynı dala art arda push edilirse eski çalışma iptal edilir, yalnızca sonuncusu sürer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Bir test takılırsa CI saatlerce beklemesin (normalde ~15 saniye sürer).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Random SECRET_KEY
        # Migration komutları ayarları okur, SECRET_KEY ister. Dosyaya sabit yazılırsa sır taraması
        # (gitleaks) onu gerçek sır sanıyor; her çalışmada rastgele üretilir.
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Lint
        # Kullanılmayan import, tanımsız ad gibi hataları yakalar. Sürüm sabit: yeni ruff
        # sürümü yeni kural getirip kod değişmeden CI'ı kırmasın.
        run: pip install ruff==0.13.0 && ruff check app tests
      - name: Tests
        # Test kapsamı %90'ın altına düşerse kırmızı: yeni kod testsiz eklenemesin.
        run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=90
      - name: Migrations match models
        # Boş veritabanına bütün migration'ları uygular, sonra modellerle karşılaştırır.
        # Model değişip `alembic revision --autogenerate` unutulduysa kırmızı olur.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: alembic upgrade head && alembic check

  # Canlı veritabanı PostgreSQL: SQLite'ta geçip PostgreSQL'de bozulan sorgu kalmasın diye
  # bütün testler bir de gerçek PostgreSQL üzerinde koşar, migration'lar da orada denenir.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: muti
          POSTGRES_PASSWORD: muti
          POSTGRES_DB: muti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muti" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Random SECRET_KEY
        # Migration komutları ayarları okur, SECRET_KEY ister. Dosyaya sabit yazılırsa sır taraması
        # (gitleaks) onu gerçek sır sanıyor; her çalışmada rastgele üretilir.
        run: echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql://muti:muti@localhost:5432/muti
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://muti:muti@localhost:5432/muti
        run: python -m pytest -q

  # Kullanılan paketlerde bilinen güvenlik açığı var mı? (PyPI güvenlik veritabanı)
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  # Frontend'de derleme adımı yok; her JS dosyasının sözdizimi (syntax) doğru mu diye bakılır.
  # Yazım hatası olan tek bir dosya bütün uygulamayı açılmaz hale getirir.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check

  # Commit'lere yanlışlıkla şifre / API anahtarı girdiyse yakalar (kurallar: .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
