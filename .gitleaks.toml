# Sızmış sır taraması (CI'daki "secrets" işi) için ayarlar.
# Varsayılan kuralların hepsi geçerli; yalnızca bilerek yazılmış sahte değerler hariç tutulur.
[extend]
useDefault = true

[allowlist]
description = "Testlerdeki sahte anahtarlar ve boş örnek ayar dosyası"
paths = [
  '''backend/tests/''',
  '''backend/\.env\.example''',
]
# 1aa3520'da CI dosyasına yazılmış sahte test anahtarı (sonraki commit'te kaldırıldı; gerçek sır değil).
regexes = [
  '''ci-secret-key-that-is-long-enough-for-hs256''',
]
